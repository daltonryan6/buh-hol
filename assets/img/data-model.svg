<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="clarity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="strata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="workday" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="datamarts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1020" height="620" rx="12" fill="#0f172a"/>

  <!-- ═══════════ COLUMN HEADERS ═══════════ -->
  <text x="110" y="32" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">INBOUND</text>
  <text x="450" y="32" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600" letter-spacing="1.5">CORE_DATA</text>
  <text x="450" y="46" text-anchor="middle" fill="#3b82f6" font-size="9" letter-spacing="0.5">Dynamic Tables</text>
  <text x="830" y="32" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600" letter-spacing="1.5">DATAMARTS</text>
  <text x="830" y="46" text-anchor="middle" fill="#d97706" font-size="9" letter-spacing="0.5">Reporting Dashboards</text>

  <!-- ═══════════ SOURCE SYSTEM LABELS ═══════════ -->
  <!-- Epic Clarity group label -->
  <rect x="12" y="56" width="196" height="18" rx="3" fill="#334155" opacity="0.7"/>
  <text x="110" y="69" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600" letter-spacing="0.5">EPIC CLARITY</text>

  <!-- Strata group label -->
  <rect x="12" y="372" width="196" height="18" rx="3" fill="#064e3b" opacity="0.7"/>
  <text x="110" y="385" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="600" letter-spacing="0.5">STRATA DECISION SUPPORT</text>

  <!-- Workday group label -->
  <rect x="12" y="450" width="196" height="18" rx="3" fill="#4c1d95" opacity="0.7"/>
  <text x="110" y="463" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="600" letter-spacing="0.5">WORKDAY PROCUREMENT</text>

  <!-- ═══════════ INBOUND: CLARITY TABLES ═══════════ -->
  <g filter="url(#shadow)">
    <rect x="20" y="80" width="180" height="44" rx="6" fill="url(#clarity)"/>
    <text x="110" y="100" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">PATIENT</text>
    <text x="110" y="114" text-anchor="middle" fill="#cbd5e1" font-size="9">100 rows</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="20" y="134" width="180" height="44" rx="6" fill="url(#clarity)"/>
    <text x="110" y="154" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">PAT_ENC</text>
    <text x="110" y="168" text-anchor="middle" fill="#cbd5e1" font-size="9">7,500 encounters</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="20" y="188" width="180" height="44" rx="6" fill="url(#clarity)"/>
    <text x="110" y="208" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">CLARITY_SER</text>
    <text x="110" y="222" text-anchor="middle" fill="#cbd5e1" font-size="9">20 providers</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="20" y="242" width="180" height="44" rx="6" fill="url(#clarity)"/>
    <text x="110" y="262" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">ORDER_PROC</text>
    <text x="110" y="276" text-anchor="middle" fill="#cbd5e1" font-size="9">75,000 lab orders</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="20" y="296" width="180" height="44" rx="6" fill="url(#clarity)"/>
    <text x="110" y="316" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">HSP_ACCT_DX_LIST</text>
    <text x="110" y="330" text-anchor="middle" fill="#cbd5e1" font-size="9">22,500 diagnoses</text>
  </g>

  <!-- ═══════════ INBOUND: STRATA TABLE ═══════════ -->
  <g filter="url(#shadow)">
    <rect x="20" y="394" width="180" height="44" rx="6" fill="url(#strata)"/>
    <text x="110" y="414" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">STRATA_BUDGET</text>
    <text x="110" y="428" text-anchor="middle" fill="#a7f3d0" font-size="9">300 budget rows</text>
  </g>

  <!-- ═══════════ INBOUND: WORKDAY TABLE ═══════════ -->
  <g filter="url(#shadow)">
    <rect x="20" y="472" width="180" height="44" rx="6" fill="url(#workday)"/>
    <text x="110" y="492" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">WORKDAY_PURCHASES</text>
    <text x="110" y="506" text-anchor="middle" fill="#ddd6fe" font-size="9">2,000 purchase orders</text>
  </g>

  <!-- ═══════════ CORE_DATA BOXES ═══════════ -->
  <g filter="url(#shadow)">
    <rect x="360" y="80" width="180" height="44" rx="6" fill="url(#core)"/>
    <text x="450" y="100" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">DIM_PATIENT</text>
    <text x="450" y="114" text-anchor="middle" fill="#bfdbfe" font-size="9">Patient demographics</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="360" y="134" width="180" height="44" rx="6" fill="url(#core)"/>
    <text x="450" y="154" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">DIM_PROVIDER</text>
    <text x="450" y="168" text-anchor="middle" fill="#bfdbfe" font-size="9">Provider directory</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="360" y="188" width="180" height="44" rx="6" fill="url(#core)"/>
    <text x="450" y="208" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">FACT_ENCOUNTER</text>
    <text x="450" y="222" text-anchor="middle" fill="#bfdbfe" font-size="9">Visit details + provider</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="360" y="242" width="180" height="44" rx="6" fill="url(#core)"/>
    <text x="450" y="262" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">FACT_ORDER</text>
    <text x="450" y="276" text-anchor="middle" fill="#bfdbfe" font-size="9">Lab orders + encounter</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="360" y="296" width="180" height="44" rx="6" fill="url(#core)"/>
    <text x="450" y="316" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">FACT_DIAGNOSIS</text>
    <text x="450" y="330" text-anchor="middle" fill="#bfdbfe" font-size="9">Dx codes + encounter</text>
  </g>

  <!-- ═══════════ DATAMARTS BOXES ═══════════ -->
  <g filter="url(#shadow)">
    <rect x="710" y="110" width="250" height="58" rx="6" fill="url(#datamarts)"/>
    <text x="835" y="133" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">DEPARTMENT_DASHBOARD</text>
    <text x="835" y="149" text-anchor="middle" fill="#fde68a" font-size="9">Clarity + Strata + Workday</text>
    <text x="835" y="161" text-anchor="middle" fill="#fde68a" font-size="8">Volumes, charges, budget, purchases</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="200" width="250" height="54" rx="6" fill="url(#datamarts)"/>
    <text x="835" y="223" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">ED_THROUGHPUT</text>
    <text x="835" y="239" text-anchor="middle" fill="#fde68a" font-size="9">ED visits, wait times, Dx detail</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="286" width="250" height="54" rx="6" fill="url(#datamarts)"/>
    <text x="835" y="309" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">READMISSION_RISK</text>
    <text x="835" y="325" text-anchor="middle" fill="#fde68a" font-size="9">30-day readmission flags</text>
  </g>

  <!-- ═══════════ ARROWS: INBOUND → CORE_DATA ═══════════ -->
  <line x1="200" y1="102" x2="358" y2="102" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="200" y1="210" x2="358" y2="156" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="200" y1="156" x2="358" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="200" y1="216" x2="358" y2="216" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="200" y1="264" x2="358" y2="264" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="200" y1="166" x2="358" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="200" y1="318" x2="358" y2="318" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="200" y1="172" x2="358" y2="308" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ═══════════ ARROWS: CORE_DATA → DATAMARTS ═══════════ -->
  <line x1="540" y1="210" x2="708" y2="139" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowGold)" opacity="0.5"/>
  <line x1="540" y1="210" x2="708" y2="221" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowGold)" opacity="0.5"/>
  <line x1="540" y1="102" x2="708" y2="215" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowGold)" opacity="0.5"/>
  <line x1="540" y1="318" x2="708" y2="233" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowGold)" opacity="0.5"/>
  <line x1="540" y1="216" x2="708" y2="307" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowGold)" opacity="0.5"/>
  <line x1="540" y1="108" x2="708" y2="301" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowGold)" opacity="0.5"/>

  <!-- ═══════════ ARROWS: STRATA/WORKDAY → DEPARTMENT_DASHBOARD ═══════════ -->
  <line x1="200" y1="416" x2="708" y2="145" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowGold)" opacity="0.5"/>
  <line x1="200" y1="494" x2="708" y2="155" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowGold)" opacity="0.5"/>

  <!-- ═══════════ LEGEND ═══════════ -->
  <rect x="20" y="540" width="980" height="65" rx="8" fill="#1e293b" opacity="0.6"/>
  <text x="40" y="562" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="1">SOURCE SYSTEMS</text>
  <rect x="40" y="572" width="12" height="12" rx="2" fill="url(#clarity)"/>
  <text x="58" y="583" fill="#cbd5e1" font-size="10">Epic Clarity (Snowlift)</text>
  <rect x="230" y="572" width="12" height="12" rx="2" fill="url(#strata)"/>
  <text x="248" y="583" fill="#a7f3d0" font-size="10">Strata (Connectors)</text>
  <rect x="410" y="572" width="12" height="12" rx="2" fill="url(#workday)"/>
  <text x="428" y="583" fill="#ddd6fe" font-size="10">Workday (Connectors)</text>

  <text x="620" y="562" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="1">LAYERS</text>
  <rect x="620" y="572" width="12" height="12" rx="2" fill="url(#core)"/>
  <text x="638" y="583" fill="#bfdbfe" font-size="10">Core Data (auto-refresh)</text>
  <rect x="810" y="572" width="12" height="12" rx="2" fill="url(#datamarts)"/>
  <text x="828" y="583" fill="#fde68a" font-size="10">Datamarts (auto-refresh)</text>
</svg>